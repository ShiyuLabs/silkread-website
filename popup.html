<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 310px;
      padding: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: linear-gradient(160deg, #f5f3ff 0%, #eff6ff 60%, #f0fdf4 100%);
    }
    h3 {
      margin: 0 0 12px 0; font-size: 15px; font-weight: 800; text-align: center;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .section { margin-bottom: 12px; }
    .section-label { font-size: 11px; color: #6d28d9; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
    button {
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; cursor: pointer; transition: all 0.2s; font-weight: 600;
    }
    button:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white; border: none;
      box-shadow: 0 2px 8px rgba(79,70,229,0.3);
    }
    .btn-primary.active {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      box-shadow: 0 2px 8px rgba(16,185,129,0.3);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      color: #3730a3; border-color: #a5b4fc;
    }
    .btn-secondary.active { background: linear-gradient(135deg, #dbeafe, #ede9fe); color: #1e40af; border-color: #818cf8; }
    .mode-group { display: flex; gap: 6px; }
    .mode-group button { flex: 1; padding: 8px 4px; font-size: 12px; border-radius: 8px; background: #f5f3ff; color: #6d28d9; border: 1.5px solid #c4b5fd; font-weight: 600; }
    .mode-group button.active { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border-color: #4f46e5; box-shadow: 0 2px 6px rgba(79,70,229,0.25); }
    .status-item { display: flex; align-items: center; font-size: 12px; color: #666; margin-top: 8px; justify-content: center; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #999; margin-right: 6px; transition: background 0.3s; }
    .status-dot.active { background: #10b981; box-shadow: 0 0 4px #10b981; }
    .lang-row { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
    .lang-row label { font-size: 12px; color: #6d28d9; white-space: nowrap; width: 32px; flex-shrink: 0; font-weight: 600; }
    select {
      flex: 1; padding: 7px 8px; border: 1px solid #c4b5fd; border-radius: 8px;
      font-size: 12px; background: #fff; cursor: pointer; color: #333; transition: border-color 0.2s;
    }
    select:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,0.12); }
    .arrow { font-size: 14px; color: #9ca3af; font-weight: bold; }
    
    .sub-panel {
      background: linear-gradient(135deg, #faf5ff 0%, #eff6ff 100%);
      border: 1px solid #c4b5fd; border-radius: 10px;
      padding: 12px 11px; margin-top: 4px;
      box-shadow: 0 2px 8px rgba(109,40,217,0.06);
    }
    
    .tip { margin-top: 10px; font-size: 11px; color: #6b7280; border-top: 1px solid #e0e7ff; padding-top: 10px; line-height: 1.7; }
    
    /* 余额行 */
    .balance-row { 
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed #c4b5fd; 
    }
    .balance-text { font-size: 12px; color: #374151; font-weight: 700; white-space: nowrap; flex: 1; min-width: 0; }

    /* 拨动开关 */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 13px;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border: 1px solid #6ee7b7; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(16,185,129,0.08);
    }
    .toggle-label { font-size: 13px; font-weight: 700; color: #065f46; }
    .toggle-switch { position: relative; display: inline-block; width: 46px; height: 26px; cursor: pointer; flex-shrink: 0; }
    .toggle-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; background: #d1d5db; border-radius: 26px; transition: background 0.28s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 20px; height: 20px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%;
      transition: transform 0.28s; box-shadow: 0 1px 4px rgba(0,0,0,0.22);
    }
    .toggle-switch input:checked + .toggle-slider { background: #10b981; }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
    .btn-topup {
      padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; flex-shrink: 0; width: auto;
      cursor: pointer; border: none;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white; transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(124,58,237,0.35);
    }
    .btn-topup:hover { background: linear-gradient(135deg, #7c3aed, #6d28d9); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(109,40,217,0.4); }
    .btn-topup:active { transform: translateY(0); }

    /* 账户状态行 */
    .account-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 5px; font-size: 11px;
    }
    .account-email {
      color: #6b7280; font-weight: 500;
      text-overflow: ellipsis; overflow: hidden; max-width: 175px; white-space: nowrap;
    }
    .btn-sm-link {
      font-size: 11px; background: none; border: none; cursor: pointer; padding: 0;
      width: auto; color: #7c3aed; text-decoration: underline; font-weight: 600;
      box-shadow: none; transition: color 0.2s;
    }
    .btn-sm-link:hover { color: #5b21b6; box-shadow: none; transform: none; }

    /* 登录验证框 */
    .login-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px); z-index: 200; align-items: center; justify-content: center;
    }
    .login-overlay.open { display: flex; animation: fadeIn 0.2s ease-out; }
    .login-box {
      background: #fff; border-radius: 16px; padding: 22px 18px 16px; width: 258px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .login-box h4 { margin: 0 0 4px; font-size: 15px; color: #111; font-weight: 800; }
    .login-box > p { margin: 0 0 14px; font-size: 12px; color: #6b7280; }
    .login-input {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 13px;
      color: #111; outline: none; margin-bottom: 10px; font-family: inherit;
      transition: border-color 0.2s;
    }
    .login-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.1); }
    .login-input::placeholder { color: #9ca3af; }
    .login-btn-confirm {
      width: 100%; padding: 10px; background: #4f46e5; color: white;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: background 0.2s; margin-bottom: 8px;
    }
    .login-btn-confirm:hover:not(:disabled) { background: #4338ca; }
    .login-btn-confirm:disabled { background: #a5b4fc; cursor: not-allowed; }
    .login-status { font-size: 12px; min-height: 18px; margin-bottom: 6px; font-weight: 500; text-align: center; }
    .login-footer { display: flex; justify-content: space-between; align-items: center; }
    
    /* 充值套餐卡片 */
    .pkg-row { display: flex; gap: 8px; margin: 12px 0 10px; }
    .pkg-card {
      flex: 1; padding: 10px 4px; border: 2px solid #f3f4f6; border-radius: 10px;
      text-align: center; cursor: pointer; transition: all 0.2s; background: #fff;
    }
    .pkg-card:hover { border-color: #8b5cf6; }
    .pkg-card.selected { border-color: #8b5cf6; background: #f5f3ff; }
    .pkg-card .pkg-price { font-size: 16px; font-weight: 800; color: #7c3aed; }
    .pkg-card .pkg-qty   { font-size: 11px; color: #6b7280; margin-top: 4px; font-weight: 500;}
    .pkg-card .pkg-tag   { font-size: 9px; background: #ef4444; color: #fff; border-radius: 4px; padding: 2px 6px; margin-top: 4px; display: inline-block; font-weight: 600; letter-spacing: 0.5px;}
    
    /* 充值模态框 */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .modal-box {
      background: #fff; border-radius: 16px; padding: 20px 18px 16px;
      width: 258px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      transform: scale(1); animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popUp { from { transform: scale(0.95); } to { transform: scale(1); } }
    
    .modal-box h4 { margin: 0 0 6px; font-size: 15px; color: #111; font-weight: 800; }
    .modal-price { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
    .modal-btn-row { display: flex; gap: 10px; margin-top: 12px; }
    .modal-btn {
      flex: 1; padding: 10px; border-radius: 8px; font-size: 13px;
      font-weight: 700; cursor: pointer; border: none; transition: all 0.2s;
    }
    .modal-btn.cancel  { background: #f3f4f6; color: #4b5563; }
    .modal-btn.cancel:hover { background: #e5e7eb; color: #111; }
    .modal-btn.confirm { background: #4f46e5; color: white; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3); }
    .modal-btn.confirm:hover { background: #4338ca; box-shadow: 0 4px 12px rgba(67, 56, 202, 0.4); }
  </style>
</head>
<body>
  <h3>✦ 诗语翻译 AI 助手</h3>

  <!-- 核心翻译引擎 -->
  <div class="section">
    <div class="section-label">翻译模型与计费</div>
    <div class="sub-panel">
      <div class="lang-row">
        <label>模型</label>
        <select id="managedModel">
          <option value="free-translation">🆓 免费翻译（谷歌通道）</option>
          <option value="deepseek-chat">⚡ DeepSeek V3（8积分/1K词）</option>
          <option value="qwen3-235b-a22b">🌟 Qwen3-235B（18积分/1K词）</option>
          <option value="gemini-2.5-flash">🎯 Gemini 2.5 Flash（25积分/1K词）</option>
          <option value="gpt-5-mini">🚀 GPT-5 mini（80积分/1K词）</option>
          <option value="claude-sonnet-4-6">👑 Claude Sonnet 4.6（179积分/1K词）</option>
        </select>
      </div>
      <div class="balance-row" id="balanceRow">
        <span class="balance-text" id="balanceText">余额：加载中</span>
        <button class="btn-topup" id="topupBtn">充值</button>
      </div>      <div class="account-row">
        <span class="account-email" id="accountEmail">未登录</span>
        <button class="btn-sm-link" id="accountActionBtn">登录</button>
      </div>    </div>
  </div>

  <!-- 语言方向 -->
  <div class="section">
    <div class="section-label">翻译方向</div>
    <div class="lang-row">
      <label>从</label>
      <select id="sourceLang">
        <option value="auto">自动检测</option>
        <option value="en">英语</option>
        <option value="zh-CN">中文（简体）</option>
        <option value="zh-TW">中文（繁体）</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
        <option value="pt">葡萄牙语</option>
        <option value="ru">俄语</option>
        <option value="ar">阿拉伯语</option>
        <option value="it">意大利语</option>
      </select>
      <span class="arrow"></span>
      <select id="targetLang">
        <option value="zh-CN">中文（简体）</option>
        <option value="zh-TW">中文（繁体）</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
        <option value="pt">葡萄牙语</option>
        <option value="ru">俄语</option>
        <option value="ar">阿拉伯语</option>
        <option value="it">意大利语</option>
      </select>
    </div>
  </div>

  <!-- 自动翻译 -->
  <div class="section">
    <div class="toggle-row">
      <span class="toggle-label">自动翻译</span>
      <label class="toggle-switch">
        <input type="checkbox" id="autoToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <!-- 显示模式 -->
  <div class="section">
    <div class="section-label">显示模式</div>
    <div class="mode-group">
      <button id="modeOriginal">📝 原文</button>
      <button id="modeBilingual" class="active">🔀 双语</button>
      <button id="modeTranslation">✨ 译文</button>
    </div>
  </div>

  <div class="tip">
     🆓 免费翻译：谷歌免费通道，无需登录<br>
      ⚡🌟🎯🚀👑 付费档：按实际 Token 消耗精准扣费，积分永不过期，可跨月累计
  </div>

  <script src="popup.js"></script>
</body>
</html>
