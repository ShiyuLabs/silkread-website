<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #fff;
    }
    h3 { margin: 0 0 14px 0; font-size: 15px; color: #333; font-weight: 700; text-align: center; }
    .section { margin-bottom: 16px; }
    .section-label { font-size: 12px; color: #666; margin-bottom: 8px; font-weight: 600; }
    button {
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; cursor: pointer; transition: all 0.2s; font-weight: 600;
    }
    button:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .btn-primary { background: #4f46e5; color: white; border-color: #4f46e5; }
    .btn-primary.active { background: #10b981; border-color: #10b981; }
    .btn-secondary { background: #f3f4f6; color: #333; border-color: #e5e7eb; }
    .btn-secondary.active { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
    .status-item { display: flex; align-items: center; font-size: 12px; color: #666; margin-top: 8px; justify-content: center; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #999; margin-right: 6px; transition: background 0.3s; }
    .status-dot.active { background: #10b981; box-shadow: 0 0 4px #10b981; }
    .lang-row { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
    .lang-row label { font-size: 12px; color: #555; white-space: nowrap; width: 32px; flex-shrink: 0; font-weight: 500; }
    select {
      flex: 1; padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px;
      font-size: 12px; background: #fff; cursor: pointer; color: #333; transition: border-color 0.2s;
    }
    select:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1); }
    .arrow { font-size: 14px; color: #9ca3af; font-weight: bold; }
    
    .sub-panel {
      background: #f8f9ff; border: 1px solid #e0e3ff; border-radius: 10px;
      padding: 14px 12px; margin-top: 6px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    
    .tip { margin-top: 14px; font-size: 11px; color: #888; border-top: 1px solid #f3f4f6; padding-top: 12px; line-height: 1.6; }
    
    /* 余额行保护 */
    .balance-row { 
      display: flex; align-items: center; justify-content: space-between; 
      margin-top: 12px; padding-top: 12px; border-top: 1px dashed #c7d2fe; 
    }
    .balance-text { font-size: 13px; color: #374151; font-weight: 700; }
    .btn-topup {
      padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: none; background: #8b5cf6; color: white; transition: background 0.2s; box-shadow: 0 2px 4px rgba(139, 92, 246, 0.3);
    }
    .btn-topup:hover { background: #7c3aed; box-shadow: 0 4px 6px rgba(124, 58, 237, 0.4); transform: translateY(-1px); }
    .btn-topup:active { transform: translateY(0); }

    /* 账户状态行 */
    .account-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 5px; font-size: 11px;
    }
    .account-email {
      color: #6b7280; font-weight: 500;
      text-overflow: ellipsis; overflow: hidden; max-width: 175px; white-space: nowrap;
    }
    .btn-sm-link {
      font-size: 11px; background: none; border: none; cursor: pointer; padding: 0;
      width: auto; color: #4f46e5; text-decoration: underline; font-weight: 600;
      box-shadow: none; transition: color 0.2s;
    }
    .btn-sm-link:hover { color: #4338ca; box-shadow: none; transform: none; }

    /* 登录验证框 */
    .login-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px); z-index: 200; align-items: center; justify-content: center;
    }
    .login-overlay.open { display: flex; animation: fadeIn 0.2s ease-out; }
    .login-box {
      background: #fff; border-radius: 16px; padding: 22px 18px 16px; width: 258px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .login-box h4 { margin: 0 0 4px; font-size: 15px; color: #111; font-weight: 800; }
    .login-box > p { margin: 0 0 14px; font-size: 12px; color: #6b7280; }
    .login-input {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 13px;
      color: #111; outline: none; margin-bottom: 10px; font-family: inherit;
      transition: border-color 0.2s;
    }
    .login-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.1); }
    .login-input::placeholder { color: #9ca3af; }
    .login-btn-confirm {
      width: 100%; padding: 10px; background: #4f46e5; color: white;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: background 0.2s; margin-bottom: 8px;
    }
    .login-btn-confirm:hover:not(:disabled) { background: #4338ca; }
    .login-btn-confirm:disabled { background: #a5b4fc; cursor: not-allowed; }
    .login-status { font-size: 12px; min-height: 18px; margin-bottom: 6px; font-weight: 500; text-align: center; }
    .login-footer { display: flex; justify-content: space-between; align-items: center; }
    
    /* 充值套餐卡片 */
    .pkg-row { display: flex; gap: 8px; margin: 12px 0 10px; }
    .pkg-card {
      flex: 1; padding: 10px 4px; border: 2px solid #f3f4f6; border-radius: 10px;
      text-align: center; cursor: pointer; transition: all 0.2s; background: #fff;
    }
    .pkg-card:hover { border-color: #8b5cf6; }
    .pkg-card.selected { border-color: #8b5cf6; background: #f5f3ff; }
    .pkg-card .pkg-price { font-size: 16px; font-weight: 800; color: #7c3aed; }
    .pkg-card .pkg-qty   { font-size: 11px; color: #6b7280; margin-top: 4px; font-weight: 500;}
    .pkg-card .pkg-tag   { font-size: 9px; background: #ef4444; color: #fff; border-radius: 4px; padding: 2px 6px; margin-top: 4px; display: inline-block; font-weight: 600; letter-spacing: 0.5px;}
    
    /* 充值模态框 */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .modal-box {
      background: #fff; border-radius: 16px; padding: 20px 18px 16px;
      width: 258px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      transform: scale(1); animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popUp { from { transform: scale(0.95); } to { transform: scale(1); } }
    
    .modal-box h4 { margin: 0 0 6px; font-size: 15px; color: #111; font-weight: 800; }
    .modal-price { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
    .modal-btn-row { display: flex; gap: 10px; margin-top: 12px; }
    .modal-btn {
      flex: 1; padding: 10px; border-radius: 8px; font-size: 13px;
      font-weight: 700; cursor: pointer; border: none; transition: all 0.2s;
    }
    .modal-btn.cancel  { background: #f3f4f6; color: #4b5563; }
    .modal-btn.cancel:hover { background: #e5e7eb; color: #111; }
    .modal-btn.confirm { background: #4f46e5; color: white; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3); }
    .modal-btn.confirm:hover { background: #4338ca; box-shadow: 0 4px 12px rgba(67, 56, 202, 0.4); }
  </style>
</head>
<body>
  <h3> AI 智能翻译助手</h3>

  <!-- 核心翻译引擎 -->
  <div class="section">
    <div class="section-label">翻译模型与计费</div>
    <div class="sub-panel">
      <div class="lang-row">
        <label>模型</label>
        <select id="managedModel">
          <option value="free-translation">🆓 免费翻译（谷歌通道）</option>
          <option value="deepseek-chat">⚡ DeepSeek 极速版 (消耗: 10积分/1K词)</option>
          <option value="qwen3-235b-a22b">🌟 Qwen 进阶版 (消耗: 20积分/1K词)</option>
          <option value="gemini-2.5-flash">🎯 Gemini 均衡版 (消耗: 30积分/1K词)</option>
          <option value="gpt-5-mini">🚀 GPT-5 品质版 (消耗: 50积分/1K词)</option>
          <option value="claude-sonnet-4-6">👑 Claude 顶级版 (消耗: 200积分/1K词)</option>
        </select>
      </div>
      <div class="balance-row">
        <span class="balance-text" id="balanceText"> 余额: 加载中</span>
        <button class="btn-topup" id="topupBtn">充值</button>
      </div>      <div class="account-row">
        <span class="account-email" id="accountEmail">未登录</span>
        <button class="btn-sm-link" id="accountActionBtn">登录</button>
      </div>    </div>
  </div>

  <!-- 语言方向 -->
  <div class="section">
    <div class="section-label">翻译方向</div>
    <div class="lang-row">
      <label>从</label>
      <select id="sourceLang">
        <option value="auto">自动检测</option>
        <option value="en">英语</option>
        <option value="zh-CN">中文（简体）</option>
        <option value="zh-TW">中文（繁体）</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
        <option value="pt">葡萄牙语</option>
        <option value="ru">俄语</option>
        <option value="ar">阿拉伯语</option>
        <option value="it">意大利语</option>
      </select>
      <span class="arrow"></span>
      <select id="targetLang">
        <option value="zh-CN">中文（简体）</option>
        <option value="zh-TW">中文（繁体）</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
        <option value="pt">葡萄牙语</option>
        <option value="ru">俄语</option>
        <option value="ar">阿拉伯语</option>
        <option value="it">意大利语</option>
      </select>
    </div>
  </div>

  <!-- 自动翻译 -->
  <div class="section">
    <button id="autoTranslateBtn" class="btn-primary">启用自动翻译</button>
    <div class="status-item">
      <span class="status-dot" id="autoDot"></span>
      <span id="autoStatus">已禁用自动翻译</span>
    </div>
  </div>

  <!-- 显示模式 -->
  <div class="section">
    <button id="displayModeBtn" class="btn-secondary">切换为译文只显</button>
    <div class="status-item">
      <span id="modeText" style="font-weight: 500;">当前: 双语对照显示</span>
    </div>
  </div>

  <div class="tip">
     🆓 免费翻译：谷歌免费通道，无需登录<br>
     ⚡🌟🎯🚀👑 付费档：按实际 Token 消耗精准扣费，充值后永不过期
  </div>

  <script src="popup.js"></script>
</body>
</html>
