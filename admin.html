<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗语翻译 · 管理后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f3ff; min-height: 100vh; }

    /* ── 登录界面 ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 40px 36px; width: 340px;
      box-shadow: 0 8px 32px rgba(79,70,229,0.12);
    }
    .login-card h1 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 6px;
      background: linear-gradient(90deg,#4f46e5,#7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .login-card p { font-size: 13px; color: #9ca3af; text-align: center; margin-bottom: 24px; }
    .login-input {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 14px; outline: none; margin-bottom: 14px; transition: border-color 0.2s;
    }
    .login-input:focus { border-color: #7c3aed; }
    .login-btn {
      width: 100%; padding: 11px; background: linear-gradient(135deg,#4f46e5,#7c3aed);
      color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.9; }
    .login-err { font-size: 12px; color: #ef4444; text-align: center; margin-top: 10px; min-height: 18px; }

    /* ── 主界面 ── */
    #dashboard { display: none; }
    header {
      background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff;
      padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 800; }
    .logout-btn {
      background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 16px;
      border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
    }

    .main { max-width: 960px; margin: 0 auto; padding: 28px 20px; }

    /* ── 统计卡片 ── */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: #fff; border-radius: 12px; padding: 20px 22px;
      box-shadow: 0 2px 10px rgba(79,70,229,0.07);
    }
    .stat-card .label { font-size: 12px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 32px; font-weight: 800; color: #4f46e5; margin-top: 6px; }
    .stat-card .sub   { font-size: 12px; color: #6b7280; margin-top: 4px; }

    /* ── 工具栏 ── */
    .toolbar {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .search-input {
      flex: 1; min-width: 200px; padding: 9px 14px; border: 1.5px solid #e5e7eb;
      border-radius: 9px; font-size: 13px; outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #7c3aed; }
    .refresh-btn {
      padding: 9px 20px; background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff;
      border: none; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    /* ── 用户表格 ── */
    .table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(79,70,229,0.07); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #f5f3ff; }
    th { padding: 12px 16px; text-align: left; font-size: 12px; color: #6d28d9; font-weight: 700;
         text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid #ede9fe; }
    td { padding: 12px 16px; font-size: 13px; color: #374151; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #faf5ff; }
    .credits-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }
    .credits-high { background: #d1fae5; color: #065f46; }
    .credits-mid  { background: #dbeafe; color: #1e40af; }
    .credits-low  { background: #fee2e2; color: #991b1b; }
    .credits-zero { background: #f3f4f6; color: #9ca3af; }

    .action-btn {
      padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: none; margin-right: 4px;
    }
    .btn-add  { background: #ede9fe; color: #7c3aed; }
    .btn-set  { background: #dbeafe; color: #1d4ed8; }
    .btn-add:hover { background: #ddd6fe; }
    .btn-set:hover { background: #bfdbfe; }

    /* ── 模态框：充值 ── */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      backdrop-filter: blur(2px); z-index: 100; align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #fff; border-radius: 14px; padding: 28px 26px; width: 320px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.18);
    }
    .modal h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
    .modal .email-label { font-size: 12px; color: #7c3aed; margin-bottom: 14px; font-weight: 600; }
    .modal input {
      width: 100%; padding: 10px 12px; border: 1.5px solid #e5e7eb; border-radius: 9px;
      font-size: 14px; outline: none; margin-bottom: 14px; transition: border-color 0.2s;
    }
    .modal input:focus { border-color: #7c3aed; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btns button {
      flex: 1; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 700;
      cursor: pointer; border: none;
    }
    .modal-cancel  { background: #f3f4f6; color: #4b5563; }
    .modal-confirm { background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; }
    .modal-status { font-size: 12px; min-height: 16px; margin-bottom: 10px; text-align: center; font-weight: 600; }

    .empty { text-align: center; padding: 48px; color: #9ca3af; font-size: 14px; }
    .loading { text-align: center; padding: 48px; color: #7c3aed; font-size: 14px; }
  </style>
</head>
<body>

<!-- ══ 登录界面 ══ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>✦ 诗语翻译</h1>
    <p>管理后台 · 仅限管理员访问</p>
    <input type="password" class="login-input" id="secretInput" placeholder="输入管理密码" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">登 录</button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<!-- ══ 管理界面 ══ -->
<div id="dashboard">
  <header>
    <h1>✦ 诗语翻译 · 管理后台</h1>
    <button class="logout-btn" onclick="doLogout()">退出</button>
  </header>

  <div class="main">
    <!-- 统计 -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">注册用户</div>
        <div class="value" id="statUsers">—</div>
        <div class="sub">总账户数</div>
      </div>
      <div class="stat-card">
        <div class="label">积分余额总量</div>
        <div class="value" id="statCredits">—</div>
        <div class="sub">所有用户未消耗积分</div>
      </div>
      <div class="stat-card">
        <div class="label">余额为零用户</div>
        <div class="value" id="statZero">—</div>
        <div class="sub">需充值或已用尽</div>
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索邮箱…" oninput="renderTable()">
      <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
    </div>

    <!-- 表格 -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>邮箱</th>
            <th>积分余额</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="userTable">
          <tr><td colspan="4" class="loading">加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══ 充值模态框 ══ -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">调整积分</h3>
    <div class="email-label" id="modalEmail"></div>
    <input type="number" id="modalAmount" placeholder="输入积分数量">
    <p class="modal-status" id="modalStatus"></p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">取消</button>
      <button class="modal-confirm" id="modalConfirmBtn" onclick="confirmModal()">确认</button>
    </div>
  </div>
</div>

<script>
  const API = '/api/admin-dashboard';
  let _secret = '';
  let _users  = [];
  let _modalAction = 'add';
  let _modalEmail  = '';

  // ── 登录 ──
  document.getElementById('secretInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const secret = document.getElementById('secretInput').value.trim();
    if (!secret) return;
    document.getElementById('loginErr').textContent = '';
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, action: 'list_users' }),
      });
      if (r.status === 403) {
        document.getElementById('loginErr').textContent = '密码错误';
        return;
      }
      const d = await r.json();
      if (d.error) { document.getElementById('loginErr').textContent = d.error; return; }
      _secret = secret;
      sessionStorage.setItem('admin_secret', secret);
      showDashboard(d);
    } catch (e) {
      document.getElementById('loginErr').textContent = '网络错误';
    }
  }

  function doLogout() {
    _secret = '';
    sessionStorage.removeItem('admin_secret');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('secretInput').value = '';
  }

  // ── 自动恢复登录 ──
  window.addEventListener('load', () => {
    const saved = sessionStorage.getItem('admin_secret');
    if (saved) {
      document.getElementById('secretInput').value = saved;
      doLogin();
    }
  });

  // ── 主面板 ──
  function showDashboard(data) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    applyData(data);
  }

  function applyData(data) {
    _users = data.users || [];
    document.getElementById('statUsers').textContent   = data.totalUsers.toLocaleString();
    document.getElementById('statCredits').textContent = data.totalCredits.toLocaleString();
    document.getElementById('statZero').textContent    = _users.filter(u => u.credits <= 0).length;
    renderTable();
  }

  async function loadData() {
    document.getElementById('userTable').innerHTML = '<tr><td colspan="4" class="loading">加载中…</td></tr>';
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: _secret, action: 'list_users' }),
    });
    const d = await r.json();
    applyData(d);
  }

  function renderTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const rows = _users.filter(u => !q || u.email.toLowerCase().includes(q));
    if (rows.length === 0) {
      document.getElementById('userTable').innerHTML = '<tr><td colspan="4" class="empty">暂无用户</td></tr>';
      return;
    }
    document.getElementById('userTable').innerHTML = rows.map((u, i) => {
      const cls = u.credits > 500 ? 'credits-high' : u.credits > 0 ? 'credits-mid' : 'credits-zero';
      return `<tr>
        <td style="color:#9ca3af;font-size:12px">${i + 1}</td>
        <td><strong>${escHtml(u.email)}</strong></td>
        <td><span class="credits-badge ${cls}">${u.credits.toLocaleString()} 积分</span></td>
        <td>
          <button class="action-btn btn-add" onclick="openModal('add','${escHtml(u.email)}')">＋充值</button>
          <button class="action-btn btn-set" onclick="openModal('set','${escHtml(u.email)}')">设置</button>
        </td>
      </tr>`;
    }).join('');
  }

  // ── 充值模态 ──
  function openModal(action, email) {
    _modalAction = action;
    _modalEmail  = email;
    document.getElementById('modalTitle').textContent  = action === 'add' ? '充值积分' : '设置积分';
    document.getElementById('modalEmail').textContent  = email;
    document.getElementById('modalAmount').value       = '';
    document.getElementById('modalStatus').textContent = '';
    document.getElementById('modalBg').classList.add('open');
    setTimeout(() => document.getElementById('modalAmount').focus(), 50);
  }

  function closeModal() {
    document.getElementById('modalBg').classList.remove('open');
  }

  async function confirmModal() {
    const amount = parseInt(document.getElementById('modalAmount').value, 10);
    if (!amount || isNaN(amount)) {
      document.getElementById('modalStatus').style.color = '#ef4444';
      document.getElementById('modalStatus').textContent = '请输入有效数量';
      return;
    }
    document.getElementById('modalConfirmBtn').disabled = true;
    document.getElementById('modalStatus').style.color = '#7c3aed';
    document.getElementById('modalStatus').textContent = '处理中…';
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: _secret, action: _modalAction === 'add' ? 'add_credits' : 'set_credits',
          email: _modalEmail, credits: amount, amount }),
      });
      const d = await r.json();
      if (d.ok) {
        document.getElementById('modalStatus').style.color = '#059669';
        document.getElementById('modalStatus').textContent = `✓ 成功！新余额：${(d.newTotal ?? amount).toLocaleString()} 积分`;
        setTimeout(() => { closeModal(); loadData(); }, 1200);
      } else {
        document.getElementById('modalStatus').style.color = '#ef4444';
        document.getElementById('modalStatus').textContent = d.error || '操作失败';
      }
    } catch(e) {
      document.getElementById('modalStatus').textContent = '网络错误';
    } finally {
      document.getElementById('modalConfirmBtn').disabled = false;
    }
  }

  document.getElementById('modalAmount').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmModal();
  });

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
