<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a SilkRead account for pay-as-you-go AI webpage translation.">
  <title>Create Account - SilkRead</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 14px;
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: white;
      color: #0f172a;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-field:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    .input-field.is-error { border-color: #ef4444; }
    .input-field.is-success { border-color: #22c55e; }
    .input-field.has-icon { padding-right: 44px; }
    .input-wrap { position: relative; }
    .hint { min-height: 16px; margin-top: 5px; font-size: 12px; }
    .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      padding: 6px;
    }
    .strength-bars { display: flex; gap: 4px; margin-top: 7px; }
    .strength-bar { flex: 1; height: 4px; border-radius: 2px; background: #e5e7eb; transition: background .2s; }
    .msg-box { border-radius: 8px; padding: 12px 14px; font-size: 14px; font-weight: 600; text-align: center; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="/" class="flex items-center gap-3">
        <img src="/favicon.png" alt="SilkRead logo" class="h-9 w-9 rounded-lg">
        <span class="text-xl font-bold text-slate-950">SilkRead</span>
      </a>
      <a href="/login.html" class="text-sm font-semibold text-blue-700 hover:text-blue-900">Log in</a>
    </div>
  </header>

  <main class="flex min-h-[calc(100vh-64px)] items-center justify-center px-4 py-10">
    <section class="w-full max-w-sm rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
      <div class="mb-7 text-center">
        <h1 class="text-2xl font-extrabold tracking-normal text-slate-950">Create your account</h1>
        <p class="mt-2 text-sm leading-6 text-slate-500">Start using SilkRead with free browser translation and optional paid AI tokens.</p>
      </div>

      <div class="space-y-4">
        <div>
          <input id="inp-username" type="text" class="input-field" placeholder="Username" autocomplete="username" autocorrect="off" autocapitalize="none" autofocus>
          <p id="hint-username" class="hint text-slate-400">3-20 characters. Letters, numbers, and underscores only.</p>
        </div>

        <div>
          <input id="inp-email" type="email" class="input-field" placeholder="Email address optional" autocomplete="email">
          <p id="hint-email" class="hint text-slate-400"></p>
        </div>

        <div>
          <div class="input-wrap">
            <input id="inp-password" type="password" class="input-field has-icon" placeholder="Password, at least 8 characters" autocomplete="new-password">
            <button type="button" class="eye-btn" id="toggle-password" tabindex="-1" aria-label="Toggle password visibility">
              <svg id="eye1-show" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg id="eye1-hide" class="hidden h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M10.584 10.587A2 2 0 0012 14a2 2 0 001.414-.586M9.88 4.24A10.68 10.68 0 0112 4c4.478 0 8.268 2.943 9.542 7a10.53 10.53 0 01-2.322 3.592M6.228 6.228A10.576 10.576 0 002.458 12C3.732 16.057 7.523 19 12 19a10.68 10.68 0 003.772-.692"/>
              </svg>
            </button>
          </div>
          <div id="strength-wrap" class="hidden">
            <div class="strength-bars">
              <div class="strength-bar" id="sb1"></div>
              <div class="strength-bar" id="sb2"></div>
              <div class="strength-bar" id="sb3"></div>
            </div>
            <p id="strength-label" class="hint"></p>
          </div>
          <p id="hint-password" class="hint text-slate-400"></p>
        </div>

        <div>
          <div class="input-wrap">
            <input id="inp-password2" type="password" class="input-field has-icon" placeholder="Confirm password" autocomplete="new-password">
            <button type="button" class="eye-btn" id="toggle-password2" tabindex="-1" aria-label="Toggle password visibility">
              <svg id="eye2-show" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg id="eye2-hide" class="hidden h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M10.584 10.587A2 2 0 0012 14a2 2 0 001.414-.586M9.88 4.24A10.68 10.68 0 0112 4c4.478 0 8.268 2.943 9.542 7a10.53 10.53 0 01-2.322 3.592M6.228 6.228A10.576 10.576 0 002.458 12C3.732 16.057 7.523 19 12 19a10.68 10.68 0 003.772-.692"/>
              </svg>
            </button>
          </div>
          <p id="hint-password2" class="hint text-slate-400"></p>
        </div>

        <label class="flex cursor-pointer items-start gap-3 text-sm leading-6 text-slate-600">
          <input type="checkbox" id="inp-agree" class="mt-1 h-4 w-4 rounded border-slate-300 text-blue-700">
          <span>I agree to the <a href="/terms.html" class="font-semibold text-blue-700 hover:underline">Terms of Service</a> and <a href="/privacy.html" class="font-semibold text-blue-700 hover:underline">Privacy Policy</a>.</span>
        </label>

        <div id="msg-box" class="hidden"></div>

        <button id="btn-register" class="w-full rounded-md bg-blue-700 px-4 py-3 text-sm font-bold text-white hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-60" disabled>Create account</button>
      </div>

      <p class="mt-5 text-center text-sm text-slate-500">Already have an account? <a href="/login.html" class="font-semibold text-blue-700 hover:underline">Log in</a></p>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const inpUsername = $("inp-username");
    const inpEmail = $("inp-email");
    const inpPassword = $("inp-password");
    const inpPassword2 = $("inp-password2");
    const inpAgree = $("inp-agree");
    const btnRegister = $("btn-register");
    const msgBox = $("msg-box");
    const V = { username: false, email: true, password: false, password2: false, agree: false };

    function syncBtn() {
      btnRegister.disabled = !Object.values(V).every(Boolean);
    }

    function showMsg(text, ok) {
      msgBox.textContent = text;
      msgBox.className = "msg-box " + (ok
        ? "bg-green-50 text-green-700 border border-green-200"
        : "bg-red-50 text-red-700 border border-red-200");
      msgBox.classList.remove("hidden");
    }

    inpUsername.addEventListener("input", () => {
      const value = inpUsername.value;
      const hint = $("hint-username");
      if (!value) {
        inpUsername.className = "input-field";
        hint.textContent = "3-20 characters. Letters, numbers, and underscores only.";
        hint.className = "hint text-slate-400";
        V.username = false;
      } else if (!/^[a-zA-Z0-9_]+$/.test(value)) {
        inpUsername.className = "input-field is-error";
        hint.textContent = "Use letters, numbers, and underscores only.";
        hint.className = "hint text-red-600";
        V.username = false;
      } else if (value.length < 3) {
        inpUsername.className = "input-field is-error";
        hint.textContent = "Add at least " + (3 - value.length) + " more character(s).";
        hint.className = "hint text-red-600";
        V.username = false;
      } else if (value.length > 20) {
        inpUsername.className = "input-field is-error";
        hint.textContent = "Use 20 characters or fewer.";
        hint.className = "hint text-red-600";
        V.username = false;
      } else {
        inpUsername.className = "input-field is-success";
        hint.textContent = "Username format looks good.";
        hint.className = "hint text-green-700";
        V.username = true;
      }
      syncBtn();
    });

    inpEmail.addEventListener("input", () => {
      const value = inpEmail.value.trim();
      const hint = $("hint-email");
      if (!value) {
        inpEmail.className = "input-field";
        hint.textContent = "";
        V.email = true;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
        inpEmail.className = "input-field is-error";
        hint.textContent = "Enter a valid email address.";
        hint.className = "hint text-red-600";
        V.email = false;
      } else {
        inpEmail.className = "input-field is-success";
        hint.textContent = "Email format looks good.";
        hint.className = "hint text-green-700";
        V.email = true;
      }
      syncBtn();
    });

    function strengthLevel(password) {
      if (password.length < 8) return 0;
      let score = 0;
      if (/[a-zA-Z]/.test(password)) score += 1;
      if (/[0-9]/.test(password)) score += 1;
      if (/[^a-zA-Z0-9]/.test(password)) score += 1;
      return score;
    }

    const STRENGTH_COLOR = ["#ef4444", "#f59e0b", "#22c55e"];
    const STRENGTH_TEXT = ["Weak: add both letters and numbers", "Medium", "Strong"];

    inpPassword.addEventListener("input", () => {
      const password = inpPassword.value;
      const hint = $("hint-password");
      const wrap = $("strength-wrap");

      if (!password) {
        wrap.classList.add("hidden");
        hint.textContent = "";
        V.password = false;
        checkPassword2();
        syncBtn();
        return;
      }

      wrap.classList.remove("hidden");
      const level = strengthLevel(password);
      const longEnough = password.length >= 8;
      const hasLetters = /[a-zA-Z]/.test(password);
      const hasNumbers = /[0-9]/.test(password);
      const color = !longEnough ? "#ef4444" : STRENGTH_COLOR[level - 1];

      $("sb1").style.background = password.length > 0 ? color : "#e5e7eb";
      $("sb2").style.background = longEnough && level >= 2 ? color : "#e5e7eb";
      $("sb3").style.background = longEnough && level >= 3 ? color : "#e5e7eb";

      const label = $("strength-label");
      if (!longEnough) {
        label.textContent = "Password is too short. Add " + (8 - password.length) + " more character(s).";
        label.style.color = "#ef4444";
        V.password = false;
      } else if (!hasLetters || !hasNumbers) {
        label.textContent = STRENGTH_TEXT[0];
        label.style.color = STRENGTH_COLOR[0];
        V.password = false;
      } else {
        label.textContent = STRENGTH_TEXT[level - 1];
        label.style.color = STRENGTH_COLOR[level - 1];
        V.password = true;
      }

      checkPassword2();
      syncBtn();
    });

    function checkPassword2() {
      const password2 = inpPassword2.value;
      const hint = $("hint-password2");
      if (!password2) {
        inpPassword2.className = "input-field has-icon";
        hint.textContent = "";
        V.password2 = false;
        return;
      }
      if (inpPassword.value === password2) {
        inpPassword2.className = "input-field has-icon is-success";
        hint.textContent = "Passwords match.";
        hint.className = "hint text-green-700";
        V.password2 = true;
      } else {
        inpPassword2.className = "input-field has-icon is-error";
        hint.textContent = "Passwords do not match.";
        hint.className = "hint text-red-600";
        V.password2 = false;
      }
    }

    inpPassword2.addEventListener("input", () => { checkPassword2(); syncBtn(); });

    function makeToggle(inputId, toggleId, showId, hideId) {
      $(toggleId).addEventListener("click", () => {
        const input = $(inputId);
        const show = $(showId);
        const hide = $(hideId);
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        show.classList.toggle("hidden", isPassword);
        hide.classList.toggle("hidden", !isPassword);
      });
    }

    makeToggle("inp-password", "toggle-password", "eye1-show", "eye1-hide");
    makeToggle("inp-password2", "toggle-password2", "eye2-show", "eye2-hide");

    inpAgree.addEventListener("change", () => {
      V.agree = inpAgree.checked;
      syncBtn();
    });

    async function doRegister() {
      if (btnRegister.disabled) return;
      const username = inpUsername.value.trim();
      const password = inpPassword.value;

      btnRegister.disabled = true;
      btnRegister.textContent = "Creating account...";
      msgBox.classList.add("hidden");

      try {
        const resp = await fetch("/api/user/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await resp.json();

        if (data.success) {
          showMsg("Account created. Redirecting to login...", true);
          setTimeout(() => { window.location.href = "/login.html"; }, 1200);
        } else {
          showMsg(data.message || "Registration failed. Please try again.", false);
          btnRegister.disabled = false;
          btnRegister.textContent = "Create account";
          syncBtn();
        }
      } catch (_) {
        showMsg("Network error. Please check your connection and try again.", false);
        btnRegister.disabled = false;
        btnRegister.textContent = "Create account";
        syncBtn();
      }
    }

    btnRegister.addEventListener("click", doRegister);
    [inpUsername, inpEmail, inpPassword, inpPassword2].forEach((input) => {
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") doRegister(); });
    });
  </script>
</body>
</html>
